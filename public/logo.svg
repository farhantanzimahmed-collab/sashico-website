<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .logo-text {
      font-family: 'Arial Black', 'Arial', sans-serif;
      font-weight: 900;
      font-size: 72px;
      letter-spacing: 0.08em;
    }
  </style>
  <!-- Outer stroke layer -->
  <text x="50%" y="78" dominant-baseline="auto" text-anchor="middle" class="logo-text"
    fill="none" stroke="black" stroke-width="4" stroke-linejoin="round">SASHICO</text>
  <!-- Inner fill -->
  <text x="50%" y="78" dominant-baseline="auto" text-anchor="middle" class="logo-text"
    fill="white" stroke="black" stroke-width="2">SASHICO</text>
</svg>
