name: Google Sheets Sync

on:
  # Vercel's built-in cron (vercel.json) already runs this daily at midnight.
  # Keeping only workflow_dispatch so you can trigger a manual sync from GitHub UI
  # whenever you update the Google Sheet and want changes live immediately.
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://sashico.vercel.app/api/cron/google-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
